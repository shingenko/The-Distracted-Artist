# The Distracted Artist — A minimal comic-story blog
title: The Distracted Artist
email: ""
copyright: "Samuel Reyes"
description: >-
  Short comic stories, 3–6 pages each. Read, browse by tag,
  or wander through the archives.
baseurl: ""
url: "https://samueldraws.com"
github_username: ""

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Collections — tag pages generated from data
collections:
  tags_pages:
    output: true
    permalink: /tags/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "tags_pages"
    values:
      layout: tag
  - scope:
      path: ""
    values:
      layout: default

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - new-post.sh
  - README.md
  - vendor/
